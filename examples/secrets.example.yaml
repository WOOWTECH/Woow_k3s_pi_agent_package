# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_pi_agent_package — PLACEHOLDERS ONLY.
# Never commit real values; .gitignore is anchored so a copy named
# *.secret.yaml in the repo root stays untracked, but the safe move is to copy
# this file OUTSIDE the repo, fill it in, and apply that copy:
#
#   kubectl --context woow-k3s apply -f /secure/path/pi-agent-secrets.yaml
#
# Then point the chart at them, so no credential is ever a Helm value:
#   --set cloudflare.existingCredentialsSecret=pi-tunnel-cf-creds
#   --set ttyd.existingSecret=pi-agent-ttyd     # only if ttyd.enabled=true
#
# What is NOT here, deliberately:
#   * Provider API keys (OpenRouter, Anthropic, ...). pi-web takes them in its
#     Models page and stores them on the volume; the chart never sees them.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  # cloudflare.existingCredentialsSecret. The chart-created name would be
  # <fullname>-cf-creds (pi-tunnel-cf-creds for the live tunnel release).
  name: pi-tunnel-cf-creds
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/part-of: pi-agent
  annotations:
    # A locally-managed tunnel's credential cannot be re-downloaded from
    # Cloudflare. Losing this Secret means creating a new tunnel and re-pointing
    # every DNS record.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Verbatim contents of the credentials.json that `cloudflared tunnel create`
  # wrote. Keys: AccountTag, TunnelID, TunnelName, TunnelSecret.
  credentials.json: |
    {"AccountTag":"REPLACE_ME","TunnelID":"REPLACE_ME","TunnelName":"REPLACE_ME","TunnelSecret":"REPLACE_ME"}
---
apiVersion: v1
kind: Secret
metadata:
  # ttyd.existingSecret. ttyd is disabled by default and is not deployed on
  # woow-k3s any more; this is here for a release that re-enables it.
  name: pi-agent-ttyd
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/part-of: pi-agent
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Generate it — never choose it. The terminal is a root shell:
  #   openssl rand -base64 18
  TTYD_PASSWORD: "REPLACE_ME_GENERATED"
