<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Woow k3s Pi Agent">
  <title>Woow k3s Pi Agent</title>
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#1b3f96"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
  </defs>

  <!-- Kubernetes-style hexagon: the deployment target -->
  <path d="M120 14 214 67 214 173 120 226 26 173 26 67Z" fill="url(#hex)"/>
  <path d="M120 14 214 67 214 173 120 226 26 173 26 67Z" fill="none" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Terminal frame: the browser terminal surface -->
  <rect x="58" y="72" width="124" height="96" rx="10" fill="#0e1420" stroke="#3d5680" stroke-width="3"/>
  <circle cx="72" cy="86" r="4" fill="#ff5f56"/>
  <circle cx="86" cy="86" r="4" fill="#ffbd2e"/>
  <circle cx="100" cy="86" r="4" fill="#27c93f"/>
  <line x1="58" y1="98" x2="182" y2="98" stroke="#3d5680" stroke-width="2"/>

  <!-- Pi glyph: the agent -->
  <text x="120" y="152"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="bold"
        fill="#eaf1ff" text-anchor="middle">&#960;</text>

  <!-- Prompt cursor: it is interactive, not a daemon -->
  <rect x="150" y="132" width="9" height="20" fill="#27c93f">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
