name: publication-contracts
on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/publish-image.yml'
      - '.gitea/workflows/publication-contracts.yml'
      - 'scripts/image-*.py'
      - 'scripts/accept-image.sh'
      - 'tests/test_publication_*.py'
      - 'tests/image-browser.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/publish-image.yml'
      - '.gitea/workflows/publication-contracts.yml'
      - 'scripts/image-*.py'
      - 'scripts/accept-image.sh'
      - 'tests/test_publication_*.py'
      - 'tests/image-browser.py'
jobs:
  publication-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test candidate identities and fail-closed publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pi-publication-contracts
          /tmp/pi-publication-contracts/bin/python -m pip install 'PyYAML==6.0.2'
          /tmp/pi-publication-contracts/bin/python -m unittest discover -s tests -p 'test_publication_*.py'
          bash -n scripts/accept-image.sh
          python3 -m py_compile scripts/image-candidate.py scripts/image-publication.py tests/image-browser.py
          git diff --check
