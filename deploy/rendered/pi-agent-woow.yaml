# Source: pi-agent/templates/configmap-cloudflared.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-cloudflared
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
data:
  # Locally-managed tunnel: the hostname -> service map lives here, in the
  # chart, instead of in the Cloudflare dashboard. That is what makes a second
  # team a values file rather than a support ticket.
  #
  # This lives in its own file so the Deployment can checksum it. A
  # checksum/config annotation that includes the template it is written in is a
  # nested self-reference and Helm refuses to render it.
  config.yaml: |
    tunnel: 88f7b0ed-b4f5-48b3-9fa0-acdd8a5a37af
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:20241
    no-autoupdate: true
    ingress:
      - hostname: pi-agent-woow.woowtech.io
        service: http://pi-agent.pi-agent-woow.svc.cluster.local:30142
        originRequest:
          connectTimeout: 30s
          # Belt and braces with the nginx sidecar's own Host rewrite: pi-web
          # rejects any non-loopback Host. nginx is still required (it is the
          # only thing stripping Origin), but if someone ever simplifies the
          # sidecar away, this keeps the Host half of the guard satisfied.
          httpHostHeader: localhost
      - hostname: pi-agent-woow-tty.woowtech.io
        # ttyd upgrades to a WebSocket; cloudflared proxies that natively.
        service: http://pi-agent-tty.pi-agent-woow.svc.cluster.local:7681
        originRequest:
          connectTimeout: 30s
          noHappyEyeballs: true
      - service: http_status:404
---
# Source: pi-agent/templates/configmap-nginx.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-nginx
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
data:
  nginx.conf: |
    # nginx:1.27-alpine's entrypoint already runs with `daemon off` — do not repeat it.
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr info;

    events {
        worker_connections 512;
    }

    http {
        access_log /dev/stdout;
        # Keep every scratch path in /tmp so the container does not need a
        # writable /var/cache.
        client_body_temp_path /tmp/nginx-client-body;
        proxy_temp_path       /tmp/nginx-proxy;
        fastcgi_temp_path     /tmp/nginx-fastcgi;
        uwsgi_temp_path       /tmp/nginx-uwsgi;
        scgi_temp_path        /tmp/nginx-scgi;

        default_type application/octet-stream;
        include /etc/nginx/mime.types;

        server_tokens off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        # Chat responses stream over SSE. Buffering here truncates long
        # generations at the proxy and the UI just stops mid-sentence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 100M;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 30142 default_server;

            location / {
                proxy_pass http://127.0.0.1:30141;
                proxy_http_version 1.1;

                # pi-web's isApiRequestAllowed() rejects any Host that is not a
                # loopback name or raw IP, and any Origin that doesn't match it.
                # Traffic here arrives with the public hostname, so without
                # this rewrite every auth-gated route (models, skills, plugins,
                # sessions...) answers 403 "Untrusted API request" and the UI
                # looks loaded but does nothing.
                proxy_set_header Host localhost;
                proxy_set_header Origin "";

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
