# Source: pi-agent/templates/cloudflared.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent-cloudflared
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
    app: pi-agent-cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pi-agent-cloudflared
  template:
    metadata:
      labels:
        app: pi-agent-cloudflared
      annotations:
        checksum/config: 91982a2d82d7a0035769d255502391c26b49a59c3179e2f6661a01c854bbacd1
    spec:
      # Spread the replicas: two tunnel pods on the same node buys nothing when
      # that node's container runtime is what fails.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: pi-agent-cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --metrics
            - 0.0.0.0:20241
            - run
          ports:
            - name: metrics
              containerPort: 20241
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pi-agent-cloudflared
        - name: creds
          secret:
            secretName: pi-agent-cf-creds
