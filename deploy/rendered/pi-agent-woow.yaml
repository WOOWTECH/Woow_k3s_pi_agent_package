# Source: pi-agent/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-agent
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
spec:
  podSelector:
    matchLabels:
      app: pi-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the tunnel may reach the app. Without this, any pod in this
    # multi-tenant cluster can hit the pod IP directly on pi-web's own port and
    # read /api/models-config — which returns the provider API key in plaintext,
    # unauthenticated. pi-web's Host guard permits raw IPs, so the nginx sidecar
    # is not a barrier to that path; this policy is.
    - from:
        - podSelector:
            matchLabels:
              app: pi-agent-cloudflared
      ports:
        - port: 30142
        - port: 7681
    # kubelet health probes originate from the node, not from a pod. Some CNIs
    # subject them to NetworkPolicy, and a blocked probe means the container is
    # killed on a liveness failure — so the node network is explicitly allowed.
    #
    # Scoped to the three probed ports rather than left open: an unrestricted
    # node rule admits the whole LAN to pi-web's own port, where
    # /api/models-config answers with the provider key and no authentication.
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 30141
        - port: 30142
        - port: 7681
  egress:
    # DNS must be allowed explicitly: kube-dns lives inside the service CIDR
    # that the next rule excludes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The agent's job requires the open internet — git remotes, provider APIs,
    # MCP endpoints, the Playwright CDN — so egress is allowed broadly and the
    # CLUSTER is carved out instead. Verified reachable before this policy:
    # the Kubernetes API at 10.43.0.1:443, kube-system metrics-server and
    # traefik, and sibling namespaces. Nothing the agent legitimately does needs
    # any of them.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 192.168.0.0/16
              - 169.254.169.254/32
---
# Source: pi-agent/templates/configmap-nginx.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-nginx
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
data:
  nginx.conf: |
    # nginx:1.27-alpine's entrypoint already runs with `daemon off` — do not repeat it.
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr info;

    events {
        worker_connections 512;
    }

    http {
        access_log /dev/stdout;
        # Keep every scratch path in /tmp so the container does not need a
        # writable /var/cache.
        client_body_temp_path /tmp/nginx-client-body;
        proxy_temp_path       /tmp/nginx-proxy;
        fastcgi_temp_path     /tmp/nginx-fastcgi;
        uwsgi_temp_path       /tmp/nginx-uwsgi;
        scgi_temp_path        /tmp/nginx-scgi;

        default_type application/octet-stream;
        include /etc/nginx/mime.types;

        server_tokens off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        # Chat responses stream over SSE. Buffering here truncates long
        # generations at the proxy and the UI just stops mid-sentence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 100M;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 30142 default_server;

            location / {
                proxy_pass http://127.0.0.1:30141;
                proxy_http_version 1.1;

                # pi-web's isApiRequestAllowed() rejects any Host that is not a
                # loopback name or raw IP, and any Origin that doesn't match it.
                # Traffic here arrives with the public hostname, so without
                # this rewrite every auth-gated route (models, skills, plugins,
                # sessions...) answers 403 "Untrusted API request" and the UI
                # looks loaded but does nothing.
                proxy_set_header Host localhost;
                proxy_set_header Origin "";

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
# Source: pi-agent/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
  annotations:
    # Keep user sessions, skills and provider config even if the release is
    # uninstalled — deleting a chart should not be how you lose a month of work.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 20Gi
---
# Source: pi-agent/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: pi-agent
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
spec:
  type: ClusterIP
  selector:
    app: pi-agent
  ports:
    # Only the nginx port is published. pi-web's own port stays pod-internal so
    # every request goes through the Host/Origin rewrite.
    - name: http
      port: 30142
      targetPort: 30142
---
# Source: pi-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
spec:
  replicas: 1
  # pi-web keeps all state in files on one RWO volume — sessions, worktrees,
  # models.json, skills. Two replicas would double-write every one of them, so
  # horizontal scale is not "not tuned yet", it is incorrect. Recreate (not
  # RollingUpdate) because the new pod cannot attach the volume until the old
  # one lets go.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pi-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent
        app.kubernetes.io/instance: pi-agent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pi-agent
        helm.sh/chart: pi-agent-0.2.0
        app: pi-agent
      annotations:
        # Roll the pod when the proxy config changes; otherwise an edited
        # ConfigMap sits there unapplied until something else triggers a restart.
        checksum/nginx: 9948347e9adac5aa9ee62b02ac8016af0eed3d38b8b4a991451c1b19e0474eb2
    spec:
      # This pod is, by design, an arbitrary-code-execution engine. It makes no
      # Kubernetes API calls, so a mounted ServiceAccount token would be pure
      # attack surface — anyone who gets the agent to run `curl` could use it.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      containers:
        - name: pi-web
          image: ghcr.io/woowtech/woow-k3s-pi-agent:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/pi-web-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            # Bound on all interfaces so the kubelet can reach the probe
            # endpoint at the pod IP. Nothing outside the pod is routed here:
            # the Service publishes only the nginx port.
            - name: PI_WEB_HOSTNAME
              value: "0.0.0.0"
            - name: PI_WEB_PORT
              value: "30141"
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Asia/Taipei"
            - name: VIDEO_PIPELINE_ENABLED
              value: "true"
            - name: RESET_VIDEO_TOOLS
              value: "false"
          ports:
            - name: http
              containerPort: 30141
          # A cold volume plus an NFS-backed first boot can take minutes. The
          # startup probe buys that time without having to loosen liveness once
          # the process is actually up — the alternative (a long
          # initialDelaySeconds on liveness) leaves a wedged event loop
          # undetected for just as long, every restart, forever.
          startupProbe:
            httpGet:
              path: /api/home
              port: 30141
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/home
              port: 30141
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/home
              port: 30141
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/pi-agent

        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-front
              containerPort: 30142
          readinessProbe:
            httpGet:
              path: /api/home
              port: 30142
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-agent-data
        - name: nginx-conf
          configMap:
            name: pi-agent-nginx
---
# Source: pi-agent/templates/tests/smoke.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pi-agent-smoke
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.2.0
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "==> pi-web through nginx"
          curl -fsS -o /dev/null -w 'GET /api/home -> %{http_code}\n' \
            "http://pi-agent.pi-agent-woow.svc.cluster.local:30142/api/home"
          echo "smoke OK"
