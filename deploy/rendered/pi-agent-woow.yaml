# Source: pi-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
spec:
  replicas: 1
  # pi-web keeps all state in files on one RWO volume — sessions, worktrees,
  # models.json, skills. Two replicas would double-write every one of them, so
  # horizontal scale is not "not tuned yet", it is incorrect. Recreate (not
  # RollingUpdate) because the new pod cannot attach the volume until the old
  # one lets go.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pi-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent
        app.kubernetes.io/instance: pi-agent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pi-agent
        helm.sh/chart: pi-agent-0.1.0
        app: pi-agent
      annotations:
        # Roll the pod when the proxy config changes; otherwise an edited
        # ConfigMap sits there unapplied until something else triggers a restart.
        checksum/nginx: 9ded8bb4faec547fa7203ab82a5780245dc72a33b61cc6ea5d948e982c489870
    spec:
      # This pod is, by design, an arbitrary-code-execution engine. It makes no
      # Kubernetes API calls, so a mounted ServiceAccount token would be pure
      # attack surface — anyone who gets the agent to run `curl` could use it.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      containers:
        - name: pi-web
          image: ghcr.io/woowtech/woow-k3s-pi-agent:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/pi-web-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            # Bound on all interfaces so the kubelet can reach the probe
            # endpoint at the pod IP. Nothing outside the pod is routed here:
            # the Service publishes only the nginx port.
            - name: PI_WEB_HOSTNAME
              value: "0.0.0.0"
            - name: PI_WEB_PORT
              value: "30141"
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Asia/Taipei"
            - name: VIDEO_PIPELINE_ENABLED
              value: "true"
            - name: RESET_VIDEO_TOOLS
              value: "false"
          ports:
            - name: http
              containerPort: 30141
          # A cold volume plus an NFS-backed first boot can take minutes. The
          # startup probe buys that time without having to loosen liveness once
          # the process is actually up — the alternative (a long
          # initialDelaySeconds on liveness) leaves a wedged event loop
          # undetected for just as long, every restart, forever.
          startupProbe:
            httpGet:
              path: /api/home
              port: 30141
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/home
              port: 30141
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/home
              port: 30141
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/pi-agent

        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-front
              containerPort: 30142
          readinessProbe:
            httpGet:
              path: /api/home
              port: 30142
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
        - name: ttyd
          image: ghcr.io/woowtech/woow-k3s-pi-agent:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/ttyd-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            - name: TTYD_PORT
              value: "7681"
            - name: TTYD_USERNAME
              value: "admin"
            - name: TTYD_MAX_CLIENTS
              value: "8"
            - name: TZ
              value: "Asia/Taipei"
            - name: TTYD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pi-agent-ttyd
                  key: TTYD_PASSWORD
          ports:
            - name: ttyd
              containerPort: 7681
          readinessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            # Same volume as pi-web. This is the whole point: a change made in
            # the TUI here is a change to the instance the web UI serves.
            - name: data
              mountPath: /data/pi-agent

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-agent-data
        - name: nginx-conf
          configMap:
            name: pi-agent-nginx
---
# Source: pi-agent/templates/tests/smoke.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pi-agent-smoke
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "==> pi-web through nginx"
          curl -fsS -o /dev/null -w 'GET /api/home -> %{http_code}\n' \
            "http://pi-agent.pi-agent-woow.svc.cluster.local:30142/api/home"
          echo "==> ttyd demands auth"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://pi-agent-tty.pi-agent-woow.svc.cluster.local:7681/")
          echo "GET / (no credentials) -> $code"
          # An unauthenticated 200 here means the terminal is open to anyone who
          # can reach the Service — fail loudly rather than pass a green test.
          [ "$code" = "401" ] || { echo "FAIL: expected 401 from ttyd, got $code"; exit 1; }
          echo "smoke OK"
