# Source: pi-agent/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: pi-agent-woow
  labels:
    app.kubernetes.io/name: pi-agent
    app.kubernetes.io/instance: pi-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pi-agent
    helm.sh/chart: pi-agent-0.1.0
  annotations:
    # Keep user sessions, skills and provider config even if the release is
    # uninstalled — deleting a chart should not be how you lose a month of work.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 20Gi
