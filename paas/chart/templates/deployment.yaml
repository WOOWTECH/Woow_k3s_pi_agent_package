apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-agent.fullname" . }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RWO PVC → Recreate (RollingUpdate would Multi-Attach-deadlock the volume).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pi-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/authproxy: {{ include (print $.Template.BasePath "/auth-proxy-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pi-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Render the basic-auth htpasswd from the tenant admin_password ({PLAIN}
        # scheme — the value is already a secret; strip CR/LF so a stray newline
        # cannot inject a second htpasswd line).
        - name: authproxy-init
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              CLEAN_PW=$(printf '%s' "$ADMIN_PASSWORD" | tr -d '\r\n')
              printf '%s:{PLAIN}%s\n' "$BASIC_USER" "$CLEAN_PW" > /auth/.htpasswd
              chmod 644 /auth/.htpasswd
              echo "[authproxy-init] htpasswd written for user '$BASIC_USER'"
          env:
            # The username is read from the chart Secret (not written into the pod spec) so
            # a username change only touches the Secret: the pod template stays identical,
            # the operator's reset (`helm upgrade --atomic --timeout 15s`, i.e. --wait) returns
            # at once, and its rollout restart applies the new credential. A literal value here
            # changes the pod template, forcing helm to wait for a new pod (30-70 s) inside
            # 15 s — every username change rolled back and cost ~1 min of downtime.
            # An external auth.existingSecret may not carry admin_username, so that mode keeps
            # the literal value.
            - name: BASIC_USER
              {{- if .Values.auth.existingSecret }}
              value: {{ include "pi-agent.basicAuthUsername" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-agent.secretName" . }}
                  key: admin_username
              {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-agent.secretName" . }}
                  key: admin_password
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.authProxy.initResources | nindent 12 }}
          volumeMounts:
            - name: authproxy-auth
              mountPath: /auth
      containers:
        - name: pi-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/usr/local/bin/pi-web-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: {{ .Values.piWeb.dataDir | quote }}
            - name: PI_WEB_HOSTNAME
              value: {{ .Values.piWeb.host | quote }}
            - name: PI_WEB_PORT
              value: {{ .Values.piWeb.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: VIDEO_PIPELINE_ENABLED
              value: {{ .Values.piWeb.videoPipeline | quote }}
            - name: RESET_VIDEO_TOOLS
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ .Values.piWeb.nodeMaxOldSpaceMb }}"
            {{- with .Values.piWeb.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # pi-web binds loopback → probes must run inside the container.
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:{{ .Values.piWeb.port }}/api/home >/dev/null"]
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:{{ .Values.piWeb.port }}/api/home >/dev/null"]
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:{{ .Values.piWeb.port }}/api/home >/dev/null"]
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.piWeb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.piWeb.dataDir }}
        - name: auth-proxy
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.authProxy.port }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz-upstream, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          volumeMounts:
            - name: authproxy-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: authproxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: authproxy-auth
              mountPath: /auth
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: authproxy-conf
          configMap:
            name: {{ include "pi-agent.authProxyConfigMapName" . }}
        - name: authproxy-auth
          emptyDir: {medium: Memory}
        - name: nginx-tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pi-agent.pvcName" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
