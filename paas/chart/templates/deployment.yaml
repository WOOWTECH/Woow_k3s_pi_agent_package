{{- $kitCM := printf "%s-omnigent-host" (include "pi-agent.fullname" .) }}
{{- $home := printf "%s/home" .Values.piWeb.dataDir }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-agent.fullname" . }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RWO PVC → Recreate (RollingUpdate would Multi-Attach-deadlock the volume).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pi-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/authproxy: {{ include (print $.Template.BasePath "/auth-proxy-configmap.yaml") . | sha256sum }}
        {{- if include "woow.omnigentHost.enabled" . }}
        # Restarts the pod when the omnigent-host KIT changes; omnigentHost.serverUrl
        # lives in the separate runtime ConfigMap and never restarts it.
        checksum/omnigent-host: {{ include "woow.omnigentHost.checksum" (dict "root" . "name" $kitCM) }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pi-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Render the basic-auth htpasswd from the tenant admin_password ({PLAIN}
        # scheme — the value is already a secret; strip CR/LF so a stray newline
        # cannot inject a second htpasswd line).
        - name: authproxy-init
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              CLEAN_PW=$(printf '%s' "$ADMIN_PASSWORD" | tr -d '\r\n')
              printf '%s:{PLAIN}%s\n' "$BASIC_USER" "$CLEAN_PW" > /auth/.htpasswd
              chmod 644 /auth/.htpasswd
              echo "[authproxy-init] htpasswd written for user '$BASIC_USER'"
          env:
            # The username is read from the chart Secret (not written into the pod spec) so
            # a username change only touches the Secret: the pod template stays identical,
            # the operator's reset (`helm upgrade --atomic --timeout 15s`, i.e. --wait) returns
            # at once, and its rollout restart applies the new credential. A literal value here
            # changes the pod template, forcing helm to wait for a new pod (30-70 s) inside
            # 15 s — every username change rolled back and cost ~1 min of downtime.
            # An external auth.existingSecret may not carry admin_username, so that mode keeps
            # the literal value.
            - name: BASIC_USER
              {{- if .Values.auth.existingSecret }}
              value: {{ include "pi-agent.basicAuthUsername" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-agent.secretName" . }}
                  key: admin_username
              {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-agent.secretName" . }}
                  key: admin_password
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.authProxy.initResources | nindent 12 }}
          volumeMounts:
            - name: authproxy-auth
              mountPath: /auth
      containers:
        - name: pi-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # PID 1 is tini (in the image since 0.1.0), which reaps the zombies of pi's
          # tools and of Omnigent sessions. With omnigentHost.enabled the kit's launcher
          # (/etc/omnigent-host/omnigent-host-launch, from the ConfigMap) sits between
          # tini and pi-web-start.sh: it starts the omnigent-host supervisor in the
          # background, runs pi-web unchanged in its own session and, on SIGTERM, stops
          # the supervisor (and its host) first, then pi-web. Without the omnigent CLI
          # (older image) it simply execs pi-web-start.sh.
          command: {{ include "woow.omnigentHost.command" (dict "root" . "init" (list "/usr/bin/tini" "--") "command" (list "/usr/local/bin/pi-web-start.sh")) }}
          # LITELLM_BASE_URL (same-workspace LiteLLM, llmGateway.baseUrl) from the runtime
          # ConfigMap: referenced by name only, so the URL never enters this template and
          # injecting / changing it never restarts the pod (templates/llm-gateway-configmap.yaml).
          envFrom:
            - configMapRef:
                name: {{ include "pi-agent.llmGatewayConfigMapName" . }}
                optional: true
          env:
            - name: PI_AGENT_DATA_DIR
              value: {{ .Values.piWeb.dataDir | quote }}
            - name: PI_WEB_HOSTNAME
              value: {{ .Values.piWeb.host | quote }}
            - name: PI_WEB_PORT
              value: {{ .Values.piWeb.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: VIDEO_PIPELINE_ENABLED
              value: {{ .Values.piWeb.videoPipeline | quote }}
            - name: RESET_VIDEO_TOOLS
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ .Values.piWeb.nodeMaxOldSpaceMb }}"
            # pi's real login and data (pi-agent-env.sh exports the same values, but only
            # inside pi-web-start.sh; the omnigent-host supervisor starts next to it and its
            # pi sessions must read /data/pi-agent/auth.json, not ~/.pi/agent).
            - name: PI_CODING_AGENT_DIR
              value: {{ .Values.piWeb.dataDir | quote }}
            # omnigent host inside this container (shared/omnigent-host, README.md):
            # identity + login in <dataDir>/home/.omnigent (= ~/.omnigent, where a by-hand
            # install kept them), HOME <dataDir>/home for the host and its sessions.
            {{- include "woow.omnigentHost.env" (dict
                  "root" .
                  "configHome" (printf "%s/.omnigent" $home)
                  "home" $home
                  "workspace" $home
                  "providers" "pi-original"
                  "passthrough" "PI_CODING_AGENT_DIR,PI_AGENT_DATA_DIR,PI_TELEMETRY,PI_SKIP_VERSION_CHECK,LITELLM_BASE_URL"
                  "unsetEnv" "") | nindent 12 }}
            {{- with .Values.piWeb.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # pi-web binds loopback → probes must run inside the container. Every probe command is time-bounded
          # (pi-agent.probeCommand): a pi-web that accepts TCP but never answers (SIGSTOP, event-loop deadlock)
          # used to hang `curl` for good, the probe never reported a result and the liveness restart took ~11 min
          # (AI-PI-005-1).
          startupProbe:
            exec:
              command: {{ include "pi-agent.probeCommand" . }}
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: {{ include "pi-agent.probeCommand" . }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            exec:
              command: {{ include "pi-agent.probeCommand" . }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.piWeb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.piWeb.dataDir }}
            {{- include "woow.omnigentHost.volumeMounts" (dict "root" .) | nindent 12 }}
        - name: auth-proxy
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.authProxy.port }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz-upstream, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          volumeMounts:
            - name: authproxy-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: authproxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if include "woow.authguard.enabled" . }}
            - name: authproxy-conf
              mountPath: /etc/nginx/njs/authguard.js
              subPath: authguard.js
              readOnly: true
            {{- end }}
            - name: authproxy-auth
              mountPath: /auth
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: authproxy-conf
          configMap:
            name: {{ include "pi-agent.authProxyConfigMapName" . }}
        - name: authproxy-auth
          emptyDir: {medium: Memory}
        - name: nginx-tmp
          emptyDir:
            sizeLimit: {{ .Values.authProxy.tmpSizeLimit | default "128Mi" }}
        {{- include "woow.omnigentHost.volumes" (dict "root" . "name" $kitCM) | nindent 8 }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pi-agent.pvcName" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
