{{- if not .Values.auth.existingSecret }}
{{- /* admin_password: explicit (platform sensitive_values) wins; else reuse the live
       Secret's value so `helm upgrade` never rotates the tenant's password; else
       generate once. NOTE: values the operator passes land in the helm release
       Secret (platform model) — do not assume stored values contain no secrets. */ -}}
{{- $adminPassword := include "pi-agent.resolveSecretValue" (dict "ctx" . "explicit" .Values.config.sensitive.admin_password "key" "admin_password") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pi-agent.secretName" . }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin_password: {{ $adminPassword | quote }}
  # Basic-auth username (validated by pi-agent.basicAuthUsername). Kept here, not in
  # the pod spec, so changing it never changes the pod template — see deployment.yaml.
  admin_username: {{ include "pi-agent.basicAuthUsername" . | quote }}
{{- end }}
