{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pi-agent.fullname" . }}-default-deny
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pi-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pi-agent.fullname" . }}-allow
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pi-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.ingressNamespaces }}
    - ports:
        - protocol: TCP
          port: {{ $.Values.service.targetPort }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- end }}
{{- end }}
