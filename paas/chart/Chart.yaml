apiVersion: v2
name: pi-agent
description: |
  pi coding agent (pi-web) cloud service chart.

  A per-tenant AI coding-agent workstation: the pi-web chat UI + pi coding agent
  (with its own in-browser TUI) on one RWO volume, reached through an in-pod nginx
  auth-proxy on port 8080 — the ONLY exposed port. pi-web itself binds loopback
  only, so nothing in the cluster can reach it without passing the proxy's basic
  auth, whose password is the platform-supplied tenant credential
  (config.sensitive.admin_password, has_admin_gui / helm_secret carrier — the same
  mechanism as hermes-agent).

  Derived from WOOWTECH/Woow_k3s_pi_agent_package (charts/pi-agent 0.2.5) and
  re-cut to the PaaS contract: cloudflared + NodePort removed (platform tunnel),
  ttyd removed (pi-web ships its own TUI), video pipeline off (browserless later),
  non-root, default-deny NetworkPolicy, ResourceQuota-compatible resources.
  Deployed per-tenant by paas-operator into a paas-ws-* namespace.
type: application
# 0.1.0 = first cut (2026-09-23). Image: jcr-prod mirror/derivative of
# ghcr.io/woowtech/woow-k3s-pi-agent, built by paas-odoo-ci; platform pins tag@sha256.
# 0.1.1 = authProxy.basicAuthUsername becomes tenant-changeable from the platform
# and is validated at render (pi-agent.basicAuthUsername); no image change.
# 0.1.2 = the basic-auth username moves into the chart Secret (admin_username) and
# the htpasswd init reads it via secretKeyRef, so a username change no longer changes
# the pod template (it used to time out the 15 s reset and roll back).
# 0.1.3 = (published, then reverted) platform-paired omnigent sidecar — unused.
# 0.1.4 = Omnigent host INSIDE the pi-web container (shared kit shared/omnigent-host,
# vendored byte-identically; omnigentHost.enabled, default on; no sidecar). PID 1 is
# tini; the kit launcher starts the omnigent-host supervisor in the background next to
# pi-web-start.sh. After the tenant runs `omnigent login <url>` in pi-web's terminal,
# this pi-agent comes online as a machine on that Omnigent and stays online across
# restarts (same host_id, stable name "pi-agent · <release>"; a by-hand host in
# ~/.omnigent keeps its id and login). A second manual `omnigent host` is refused by
# the kit guard. pi-web keeps the full plan (2 vCPU / 4 GiB, V8 heap 3072); sessions
# share it (no split): oom_score_adj 1000 and the kit's best-effort memory guard make
# it likely, not certain, that a runaway session goes before pi-web. omnigentHost.serverUrl
# goes to a runtime ConfigMap only (changing it never restarts the pod). Also
# fsGroupChangePolicy OnRootMismatch, terminationGracePeriodSeconds 45. Needs a
# pi-agent image with the omnigent CLI (paas-odoo-ci pi-agent/ step 4); on an older
# image the launcher just runs pi-web.
# 0.1.5 = R8 fixes. #1436: egress no longer `- {}` (allow-all) by default — DNS + the
# internet on any port EXCEPT 10/8, 172.16/12, 192.168/16 (Pod / Service CIDR, node
# IPs), 169.254/16 (cloud metadata) and 100.64/10 (CGNAT), plus the same-namespace
# Omnigent SERVER pods on :8000 (pairing over the injected in-cluster URL);
# networkPolicy.allowAllEgress restores the old rule (opt-in), sameNamespaceEgress opens
# the whole namespace. #1434: ephemeral-storage requests/limits on every container
# (pi-web 512Mi/6Gi) and a sizeLimit on nginx's /tmp emptyDir, so a pod that fills
# the node's system disk is evicted alone. No image change.
# 0.1.6 = 同工作區 LiteLLM 串接（平台注入另案；接在 charts #135 的 0.1.5 之後）：
#         新 values llmGateway.baseUrl（平台注入 http://<release>-litellm.<ns>.svc.cluster.local:4000/v1，
#         只帶網址、不帶金鑰；租戶自填的非空值優先）→ pi-web 拿到 env LITELLM_BASE_URL，
#         經不入 checksum 的 runtime ConfigMap <fullname>-llm-gateway（envFrom optional）：
#         改／清網址 pod template byte-identical、不重啟 pod，密碼重設的 15 秒 atomic
#         不受影響（tests/test-llm-gateway.sh 鎖住）；執行中的容器下次重啟才看到新值。
#         不設 OPENAI_BASE_URL／ANTHROPIC_BASE_URL。非 http(s) 網址略過、不讓 render 失敗。
#         Omnigent session 也繼承（OG_PASSTHROUGH）。egress：allowAllEgress=false（0.1.5 起預設）時，
#         網址非空才開同 ns LiteLLM proxy pod（name=litellm, component=app）TCP 4000；true 本來就連得到。
# 0.1.8 = AI-FIX-SEC-1 (#1457): the auth-proxy locks out a client IP after 10 wrong logins (429 + Retry-After 300 s,
# per client IP via CF-Connecting-IP, never per account), adds HSTS / nosniff / X-Frame-Options SAMEORIGIN / CSP frame-ancestors /
# Referrer-Policy / Permissions-Policy (an upstream header wins), hides X-Powered-By and the nginx version. Shared helper
# templates/_authproxy-guard.tpl (shared/authproxy-guard); authProxy.guard.* tunes or disables it. /healthz-upstream no longer returns pi-web's /api/home body (AI-PI-004-3).
# 0.1.9 = AI-FIX-PI-3 (stacked on 0.1.8 / #213). (1) AI-PI-005-1: the pi-web container's three exec probes are now
# time-bounded (`timeout -s KILL <curl -m + 3> curl -sf -m <probe.curlMaxSeconds> ...`, new value probe.curlMaxSeconds=5).
# A pi-web that accepts TCP but never answers (kill -STOP, event-loop deadlock) used to hang curl forever: kubelet got no
# probe result and the liveness restart took ~11 min (659 s measured on QA 243, target <= 3 min). Now the command
# always exits in <= 8 s, so the failure is counted and liveness restarts the container after failureThreshold (5) x
# periodSeconds (30) = 150 s. (2) AI-PI-005-4: a request body above authProxy.clientMaxBodySize answers a JSON 413 naming
# the limit instead of nginx's HTML page; the comment documents the 25 MiB file / 95 MiB batch / ~100 MB Cloudflare
# layers (the matching zh-TW app messages come with the pi-agent image patch-error-hints.mjs). Pod-template change:
# existing releases restart once on the next Redeploy/upgrade (data on the PVC is kept).
# 0.1.10 = image-bundled Omnigent setup, native /omnigent page and an explicit
# first-boot opt-out. The host kit remains the sole host supervisor when enabled.
# 0.1.11 = default to the human-approved 20261026.2019 PaaS image (root 0.3.13,
# Paseo 0.1.10, Omnigent 0.3.21). Platform pins its immutable image digest.
# 0.1.12 = prepare default 20261027.0210 PaaS image (root 0.3.15,
# Paseo 0.1.11, Omnigent 0.3.22). Publish only after the candidate image
# passes its independent acceptance and a human approves the formal JCR tag.
# The platform will pin the approved image digest independently.
# 0.1.13 = settings-only plugin registration (root 0.3.16, Paseo 0.1.12,
# Omnigent 0.3.25) and new 20261027.0638 PaaS candidate. This aligns Paseo
# and its settings-only flow with HA add-on 0.15.12. PaaS needs Omnigent 0.3.25
# for its combined Pi Web adapter; HA uses 0.3.24 with its own bridge. Publish only after
# the exact JCR candidate passes full acceptance and its own human approval.
# The platform must pin the promoted tag@sha256 separately.
# 0.1.14 = correct Helm install notes for the settings-only Omnigent binding.
# No workload template or image change from 0.1.13.
# 0.1.15 = promote the 20261027.1105 image (root 0.3.17, Paseo 0.1.12,
# Omnigent 0.3.26). Omnigent performs a bounded native `pi update --models`
# after an independent openai-codex login so the Pi model picker recovers without
# copying conversations or provider tokens. The settings-only binding flow remains
# unchanged. Publish only after the exact JCR candidate receives human approval.
# 0.1.16 = promote the 20261028.1328 image (root 0.3.20, Paseo 0.1.13,
# Omnigent 0.3.29). A fresh install with zero conversations now loads the Paseo
# settings panel (GET /api/plugin-paseo no longer answers 404), the first screen
# lists "Settings -> Omnigent" as step 3, and Settings -> Paseo scrolls on phones.
# Omnigent is still bound only from Settings (no setup conversation is created).
# No workload template change from 0.1.15. The platform must pin the promoted
# tag@sha256 (sha256:9a45d8ea...) separately.
