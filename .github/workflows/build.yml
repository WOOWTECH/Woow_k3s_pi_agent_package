name: build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/prepare-paseo-web.mjs"
      - "scripts/image-*.py"
      - "scripts/accept-image.sh"
      - "rootfs/**"
      - "patches/**"
      - "tests/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      multiarch:
        description: "Also build linux/arm64 (~30 min extra under QEMU)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: woowtech/woow-k3s-pi-agent

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      platforms: ${{ steps.platforms.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.multiarch }}" = "true" ]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-multiarch" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-multiarch" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify startup contracts
        run: |
          bash tests/test-profile-posix.sh
          bash tests/test-shared-runtime-seed.sh
          node --test tests/omnigent-seed.test.mjs tests/paseo-seed.test.mjs tests/plugin-pin-migration.test.mjs
          bash tests/test-pi-session-env.sh
          python3 -m pip install 'PyYAML==6.0.2'
          python3 -m unittest discover -s tests -p 'test_publication_*.py'

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name immutable candidate
        id: candidate
        run: python3 scripts/image-candidate.py prepare

      - name: Build and push candidate only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REF=${{ github.sha }}
          # A normal amd64-only main build must not evict the expensive ARM
          # cache from a tagged multiarch build. Read legacy cache once for the
          # migration and publish each workload into its own stable scope.
          cache-from: |
            type=gha,scope=${{ steps.platforms.outputs.scope }}
            type=gha,scope=buildkit
            type=gha,scope=pi-agent-amd64
          cache-to: type=gha,scope=${{ steps.platforms.outputs.scope }},mode=max
          provenance: false

      - name: Record exact candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_PLATFORMS: ${{ steps.platforms.outputs.value }}
        run: python3 scripts/image-candidate.py record

      - uses: actions/upload-artifact@v4
        with:
          name: image-candidate-${{ github.run_attempt }}
          path: image-candidate.json
          if-no-files-found: error
          retention-days: 30

  acceptance:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-candidate-${{ github.run_attempt }}
      - uses: docker/setup-qemu-action@v3
        if: contains(needs.image.outputs.platforms, 'arm64')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Accept exact image in isolated containers
        run: bash scripts/accept-image.sh image-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-acceptance-${{ github.run_attempt }}
          path: image-acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded fresh-fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-qa-diagnostics-${{ github.run_attempt }}
          path: |
            image-qa-diagnostics.json
            image-network-control.json
          if-no-files-found: warn
          retention-days: 14
