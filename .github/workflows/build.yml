name: build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/prepare-paseo-web.mjs"
      - "rootfs/**"
      - "patches/**"
      - "tests/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      multiarch:
        description: "Also build linux/arm64 (~30 min extra under QEMU)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: woowtech/woow-k3s-pi-agent

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.multiarch }}" = "true" ]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-multiarch" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-multiarch" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "scope=pi-agent-amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify startup contracts
        run: |
          bash tests/test-profile-posix.sh
          bash tests/test-shared-runtime-seed.sh
          node --test tests/omnigent-seed.test.mjs tests/paseo-seed.test.mjs
          bash tests/test-pi-session-env.sh

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REF=${{ github.sha }}
          # A normal amd64-only main build must not evict the expensive ARM
          # cache from a tagged multiarch build. Read legacy cache once for the
          # migration and publish each workload into its own stable scope.
          cache-from: |
            type=gha,scope=${{ steps.platforms.outputs.scope }}
            type=gha,scope=buildkit
            type=gha,scope=pi-agent-amd64
          cache-to: type=gha,scope=${{ steps.platforms.outputs.scope }},mode=max
          provenance: false
