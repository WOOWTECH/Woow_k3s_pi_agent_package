name: shared-runtime-seed

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "rootfs/usr/local/bin/pi-shared-runtime-seed.sh"
      - "rootfs/usr/local/bin/pi-omnigent-seed.mjs"
      - "rootfs/usr/local/bin/pi-paseo-seed.mjs"
      - "rootfs/usr/local/bin/pi-paseo-web-seed.mjs"
      - "tests/paseo-seed.test.mjs"
      - "rootfs/usr/local/bin/pi"
      - "tests/omnigent-seed.test.mjs"
      - "tests/image-startup.mjs"
      - "tests/test-pi-session-env.sh"
      - "rootfs/usr/local/bin/pi-web-start.sh"
      - "rootfs/etc/profile.d/pi-agent.sh"
      - "tests/test-shared-runtime-seed.sh"
      - "tests/test-profile-posix.sh"
      - ".github/workflows/shared-runtime-seed.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "rootfs/usr/local/bin/pi-shared-runtime-seed.sh"
      - "rootfs/usr/local/bin/pi-omnigent-seed.mjs"
      - "rootfs/usr/local/bin/pi-paseo-seed.mjs"
      - "rootfs/usr/local/bin/pi-paseo-web-seed.mjs"
      - "tests/paseo-seed.test.mjs"
      - "rootfs/usr/local/bin/pi"
      - "tests/omnigent-seed.test.mjs"
      - "tests/image-startup.mjs"
      - "tests/test-pi-session-env.sh"
      - "rootfs/usr/local/bin/pi-web-start.sh"
      - "rootfs/etc/profile.d/pi-agent.sh"
      - "tests/test-shared-runtime-seed.sh"
      - "tests/test-profile-posix.sh"
      - ".github/workflows/shared-runtime-seed.yml"

permissions:
  contents: read

jobs:
  seed-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          bash tests/test-shared-runtime-seed.sh
          bash tests/test-profile-posix.sh
          node --test tests/omnigent-seed.test.mjs tests/paseo-seed.test.mjs
          bash tests/test-pi-session-env.sh
