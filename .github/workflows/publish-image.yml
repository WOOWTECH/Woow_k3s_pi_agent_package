name: publish-accepted-image

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful build run with exact image acceptance (within 72 hours)'
        required: true
        type: string

permissions:
  contents: read

# Serialise aliases across main and release-tag candidates. The publisher also
# checks the live main/tag SHA before and after every registry write.
concurrency:
  group: root-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Promote only the accepted current digest
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python3 scripts/image-publication.py --run-id "$CANDIDATE_RUN_ID" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-publication-${{ github.run_attempt }}
          path: image-publication.json
          if-no-files-found: ignore
          retention-days: 90
