{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # pi-web keeps all state in files on one RWO volume — sessions, worktrees,
  # models.json, skills. Two replicas would double-write every one of them, so
  # horizontal scale is not "not tuned yet", it is incorrect. Recreate (not
  # RollingUpdate) because the new pod cannot attach the volume until the old
  # one lets go.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pi-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-agent.labels" . | nindent 8 }}
        {{- include "pi-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the proxy config changes; otherwise an edited
        # ConfigMap sits there unapplied until something else triggers a restart.
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      # This pod is, by design, an arbitrary-code-execution engine. It makes no
      # Kubernetes API calls, so a mounted ServiceAccount token would be pure
      # attack surface — anyone who gets the agent to run `curl` could use it.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: pi-web
          image: {{ include "pi-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pi-web-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            # Bound on all interfaces so the kubelet can reach the probe
            # endpoint at the pod IP. Nothing outside the pod is routed here:
            # the Service publishes only the nginx port.
            - name: PI_WEB_HOSTNAME
              value: "0.0.0.0"
            - name: PI_WEB_PORT
              value: {{ .Values.piWeb.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: VIDEO_PIPELINE_ENABLED
              value: {{ .Values.videoPipeline.enabled | quote }}
            - name: RESET_VIDEO_TOOLS
              value: {{ .Values.videoPipeline.reset | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.piWeb.port }}
          {{- if or .Values.omnigent.enabled .Values.sessionCwdRestore.enabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    log=/data/pi-agent/poststart.log
                    exec >> "$log" 2>&1
                    echo "=== postStart $(date -Iseconds) ==="
                    {{- if .Values.sessionCwdRestore.enabled }}
                    # Every cwd guard in pi-web derives its allowed roots from
                    # the cwd/projectRoot of EXISTING sessions (plus ~/pi-cwd-
                    # <8 digits>, which never matches here because HOME=/root).
                    # So a session whose directory has gone away is not merely
                    # unopenable: /api/models 400s for it and the model picker
                    # renders "No models" — the user cannot pick a model or
                    # start a chat at all. Directories under /tmp evaporate on
                    # every restart, which makes that a recurring failure, so
                    # recreate the missing ones before anyone loads the page.
                    node -e '
                      const fs = require("fs"), path = require("path");
                      const f = "/data/pi-agent/pi-web-session-index.json";
                      let idx;
                      try { idx = JSON.parse(fs.readFileSync(f, "utf8")); } catch { process.exit(0); }
                      const entries = idx && idx.entries ? Object.values(idx.entries) : [];
                      const seen = new Set();
                      let made = 0;
                      for (const e of entries) {
                        for (const d of [e?.info?.cwd, e?.info?.projectRoot]) {
                          // Only absolute, traversal-free paths pi-web itself recorded.
                          if (typeof d !== "string" || !path.isAbsolute(d)) continue;
                          if (d.split("/").includes("..")) continue;
                          if (seen.has(d)) continue;
                          seen.add(d);
                          if (fs.existsSync(d)) continue;
                          try { fs.mkdirSync(d, { recursive: true }); made++; console.log("restored cwd " + d); }
                          catch (err) { console.log("could not restore " + d + ": " + err.message); }
                        }
                      }
                      console.log("session cwd restore: " + made + " of " + seen.size + " recreated");
                    ' || true
                    {{- end }}
                    {{- if .Values.omnigent.enabled }}
                    export HOME={{ .Values.omnigent.home }}
                    export PATH="$HOME/.local/bin:$PATH"
                    cfg="$HOME/.omnigent/config.yaml"
                    [ -r "$cfg" ] || exit 0
                    srv=$(awk '/^server:/{print $2; exit}' "$cfg")
                    [ -n "$srv" ] || exit 0
                    command -v omni >/dev/null 2>&1 || exit 0
                    # A bare `omni host` only survives as long as it does not
                    # crash: postStart fires once per container start, so a
                    # daemon that dies inside a live pod stays dead until
                    # someone restarts the pod. Supervise it instead.
                    #
                    # The loop lives in a file rather than in `sh -c "..."` on
                    # purpose. An inline loop carries the string
                    # "omni host --server" in its own argv, so the very
                    # `pkill -f`/`omnigent stop` that is meant to stop the
                    # daemon kills the supervisor with it and nothing comes
                    # back. Verified: killing the daemon that way left nothing
                    # running at all. The path is kept clear of "omni" for the
                    # same reason — it is the supervisor's whole argv.
                    sup=/data/pi-agent/bin/pi-host-supervisor.sh
                    mkdir -p /data/pi-agent/bin
                    cat > "$sup" <<'SUPERVISOR'
                    #!/bin/sh
                    # $1 = Omnigent server URL. Started by the pi-agent chart's
                    # postStart hook; safe to run by hand for debugging.
                    while true; do
                      started=$(date +%s)
                      "$HOME/.local/bin/omni" host --server "$1" --non-interactive
                      ran=$(( $(date +%s) - started ))
                      # A run that ends almost immediately means something is
                      # wrong that retrying fast will not fix (revoked auth,
                      # unreachable server). Back off so it cannot become a hot
                      # loop that floods the log.
                      if [ "$ran" -lt 30 ]; then sleep 60; else sleep 15; fi
                    done
                    SUPERVISOR
                    chmod +x "$sup"
                    # setsid detaches it from the hook's process group, which is
                    # reaped the moment the hook returns.
                    setsid nohup sh "$sup" "$srv" \
                      >> "$HOME/.omnigent/host-stdout.log" 2>&1 < /dev/null &
                    {{- end }}
                    exit 0
          {{- end }}
          # A cold volume plus an NFS-backed first boot can take minutes. The
          # startup probe buys that time without having to loosen liveness once
          # the process is actually up — the alternative (a long
          # initialDelaySeconds on liveness) leaves a wedged event loop
          # undetected for just as long, every restart, forever.
          startupProbe:
            httpGet:
              path: /api/home
              port: {{ .Values.piWeb.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/home
              port: {{ .Values.piWeb.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/home
              port: {{ .Values.piWeb.port }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.piWeb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/pi-agent

        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-front
              containerPort: {{ .Values.nginx.port }}
          readinessProbe:
            httpGet:
              path: /api/home
              port: {{ .Values.nginx.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

        {{- if .Values.ttyd.enabled }}
        - name: ttyd
          image: {{ include "pi-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/ttyd-start.sh"]
          env:
            - name: PI_AGENT_DATA_DIR
              value: /data/pi-agent
            - name: TTYD_PORT
              value: {{ .Values.ttyd.port | quote }}
            - name: TTYD_USERNAME
              value: {{ .Values.ttyd.username | quote }}
            - name: TTYD_MAX_CLIENTS
              value: {{ .Values.ttyd.maxClients | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: TTYD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ttyd.existingSecret | default (printf "%s-ttyd" (include "pi-agent.fullname" .)) }}
                  key: TTYD_PASSWORD
          ports:
            - name: ttyd
              containerPort: {{ .Values.ttyd.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.ttyd.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.ttyd.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.ttyd.resources | nindent 12 }}
          volumeMounts:
            # Same volume as pi-web. This is the whole point: a change made in
            # the TUI here is a change to the instance the web UI serves.
            - name: data
              mountPath: /data/pi-agent
        {{- end }}

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pi-agent.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-conf
          configMap:
            name: {{ include "pi-agent.fullname" . }}-nginx
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
