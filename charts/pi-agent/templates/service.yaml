apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pi-agent.selectorLabels" . | nindent 4 }}
  ports:
    # Only the nginx port is published. pi-web's own port stays pod-internal so
    # every request goes through the Host/Origin rewrite.
    - name: http
      port: {{ .Values.nginx.port }}
      targetPort: {{ .Values.nginx.port }}
{{- if .Values.ttyd.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-agent.fullname" . }}-tty
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pi-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: ttyd
      port: {{ .Values.ttyd.port }}
      targetPort: {{ .Values.ttyd.port }}
{{- end }}
