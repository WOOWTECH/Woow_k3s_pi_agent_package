apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pi-agent.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
data:
  nginx.conf: |
    # nginx:1.27-alpine's entrypoint already runs with `daemon off` — do not repeat it.
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr info;

    events {
        worker_connections 512;
    }

    http {
        access_log /dev/stdout;
        # Keep every scratch path in /tmp so the container does not need a
        # writable /var/cache.
        client_body_temp_path /tmp/nginx-client-body;
        proxy_temp_path       /tmp/nginx-proxy;
        fastcgi_temp_path     /tmp/nginx-fastcgi;
        uwsgi_temp_path       /tmp/nginx-uwsgi;
        scgi_temp_path        /tmp/nginx-scgi;

        default_type application/octet-stream;
        include /etc/nginx/mime.types;

        server_tokens off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        # Chat responses stream over SSE. Buffering here truncates long
        # generations at the proxy and the UI just stops mid-sentence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 100M;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen {{ .Values.nginx.port }} default_server;

            location / {
                proxy_pass http://127.0.0.1:{{ .Values.piWeb.port }};
                proxy_http_version 1.1;

                # pi-web's isApiRequestAllowed() rejects any Host that is not a
                # loopback name or raw IP, and any Origin that doesn't match it.
                # Traffic here arrives with the public hostname, so without
                # this rewrite every auth-gated route (models, skills, plugins,
                # sessions...) answers 403 "Untrusted API request" and the UI
                # looks loaded but does nothing.
                proxy_set_header Host localhost;
                proxy_set_header Origin "";

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
