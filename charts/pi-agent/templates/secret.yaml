{{- if and .Values.ttyd.enabled (not .Values.ttyd.existingSecret) }}
{{- if not .Values.ttyd.password }}
{{- fail "ttyd.password must be set — the browser terminal is a root shell and this chart will not ship one with a blank or default password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pi-agent.fullname" . }}-ttyd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  TTYD_PASSWORD: {{ .Values.ttyd.password | quote }}
{{- end }}
