# Live instance values for release pi-agent-4 in namespace pi-agent-woow on the
# woow-k3s cluster. Recovered from `helm get values pi-agent-4` so the release can be
# rebuilt from this repo. NO SECRETS HERE (see "Instance values" in the README).

fullnameOverride: pi-agent-4

image:
  repository: ghcr.io/woowtech/woow-k3s-pi-agent
  tag: "0.2.1"
  pullPolicy: IfNotPresent

timezone: Asia/Taipei
logLevel: info

videoPipeline:
  enabled: true

persistence:
  storageClassName: longhorn
  size: 20Gi

# Bumped 2026-09-15: pi-web was CPU/memory constrained under load (one
# instance was sitting near the chart's default 4Gi limit). Requests ==
# limits so the container gets a fixed reservation instead of being
# throttled under load. max-old-space-size is raised to match — Node's
# heap would otherwise still cap out around the old container limit even
# with more RAM available, leaving ~2Gi of headroom below 16Gi for
# non-heap/RSS.
piWeb:
  resources:
    requests:
      cpu: "12"
      memory: 16Gi
    limits:
      cpu: "12"
      memory: 16Gi

extraEnv:
  - name: NODE_OPTIONS
    value: --max-old-space-size=14336

omnigent:
  enabled: true
  home: /data/pi-agent/home

# The tunnel is a release of its own (pi-tunnel); an agent must not own it.
# The live release values still carry a stale cloudflare.tunnelId/hostnames
# block pointing at the retired tunnel 88f7b0ed and pi-agent-woow.woowtech.io.
# It renders nothing while cloudflare.enabled=false, so it is deliberately not
# reproduced here.
cloudflare:
  enabled: false

ttyd:
  enabled: false
  username: admin
  maxClients: 8

networkPolicy:
  enabled: true
  # OFF on the live releases on purpose: switching it on adds an ingress rule to
  # a NetworkPolicy that is serving traffic right now. It restarts nothing, but
  # it is a deliberate change, not a side effect of adopting these values. Turn
  # it on when you next want `helm test <release>` to be able to pass here.
  allowHelmTest: false
  extraCloudflaredApps:
    - npm
